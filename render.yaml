services:
  - type: web
    name: email-servlet
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: email-postgres
          property: connectionString
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: Email Servlet <onboarding@resend.dev>

databases:
  - name: email-postgres
    plan: free
    region: singapore
