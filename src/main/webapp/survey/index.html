<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khảo sát</title>
    <link rel="stylesheet" href="assets/css/survey.css">
</head>
<body>
    <main class="survey-page">
        <img class="avatar" src="assets/images/avatar.jpg" alt="Ảnh đại diện">
        <h1>Khảo sát</h1>
        <p>Vui lòng dành ít phút để hoàn thành khảo sát.</p>

        <form action="../survey" method="post" accept-charset="UTF-8">
            <section aria-labelledby="thong-tin-ca-nhan">
                <h2 id="thong-tin-ca-nhan">Thông tin cá nhân</h2>
                <p class="form-row"><label for="firstName">Tên</label><input type="text" id="firstName" name="firstName" required></p>
                <p class="form-row"><label for="lastName">Họ</label><input type="text" id="lastName" name="lastName" required></p>
                <p class="form-row"><label for="email">Email</label><input type="email" id="email" name="email" autocomplete="email" required></p>
                <p class="form-row"><label for="dateOfBirth">Ngày sinh</label><input type="date" id="dateOfBirth" name="dateOfBirth" required></p>
            </section>

            <fieldset>
                <legend>Bạn biết đến chúng tôi qua đâu?</legend>
                <p class="option-list option-list--inline">
                    <label><input type="radio" name="source" value="search engine" required>Công cụ tìm kiếm</label>
                    <label><input type="radio" name="source" value="word of mouth">Bạn bè giới thiệu</label>
                    <label><input type="radio" name="source" value="social media">Mạng xã hội</label>
                    <label><input type="radio" name="source" value="other">Khác</label>
                </p>
            </fieldset>

            <fieldset>
                <legend>Bạn có muốn nhận thông tin về đĩa CD mới và ưu đãi đặc biệt không?</legend>
                <p class="option-list">
                    <label><input type="checkbox" name="cdOffers" value="yes">Có, tôi muốn nhận ưu đãi</label>
                    <label><input type="checkbox" name="emailAnnouncements" value="yes">Có, hãy gửi thông báo qua email</label>
                </p>
            </fieldset>

            <p class="form-row"><label for="contactMethod">Vui lòng liên hệ với tôi qua:</label>
                <select id="contactMethod" name="contactMethod">
                    <option value="email">Email</option><option value="phone">Điện thoại</option><option value="text">Tin nhắn</option>
                </select>
            </p>
            <button type="submit">Gửi khảo sát</button>
        </form>
    </main>
</body>
</html>
